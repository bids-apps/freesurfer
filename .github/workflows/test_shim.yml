---
name: test shim

on:
  pull_request:
  push:
    branches:
    - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  pytest:

    runs-on: ubuntu-latest

    steps:
    - name: Clone repo
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: python -m pip install pytest nibabel pandas numpy

    - name: Run tests
      run: python -m pytest test -q
